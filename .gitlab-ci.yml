stages:
  - sync
  - release
  - deploy

variables:
  GLAB_ENABLE_CI_AUTOLOGIN: "true"
  GLAB_VERSION: "1.113.0"
  GIT_DEPTH: "0"
  GIT_STRATEGY: "fetch"
  GIT_CLEAN_FLAGS: "-ffdx"

.github-common: &github-common
  tags: [linux-truenas]
  image: alpine:3.19
  before_script:
    - apk add --no-cache bash curl jq git github-cli openssh-client
    - sh scripts/setup-ssh-key.sh GITHUB_SSH_PRIVATE_KEY github.com

# Push every branch/tag update to the GitHub mirror, then watch the
# GitHub Actions run so a failed GitHub build fails this pipeline.
github-sync:
  stage: sync
  <<: *github-common
  timeout: 3h
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_TAG
  script:
    - git remote add github git@github.com:justacalico/vsp.git || true
    - git remote update github
    - |
      if [ -n "${CI_COMMIT_TAG:-}" ]; then
        LOCAL_SHA=$(git rev-parse "$CI_COMMIT_TAG")
        REMOTE_SHA=$(git ls-remote --tags github "refs/tags/$CI_COMMIT_TAG" | awk '{print $1}' | head -n1)
        # Only a real push triggers a fresh run; an already-mirrored tag
        # legitimately reuses the run that already exists for its commit.
        SINCE=""
        if [ -n "$REMOTE_SHA" ] && [ "$REMOTE_SHA" = "$LOCAL_SHA" ]; then
          echo "Tag $CI_COMMIT_TAG already mirrored to GitHub at $REMOTE_SHA, skipping"
        else
          SINCE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          git push -f github "$CI_COMMIT_TAG"
        fi
        # v* tags trigger the release build on GitHub; watch it so a failed
        # release build fails this pipeline.
        if echo "$CI_COMMIT_TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+'; then
          SHA=$(git rev-parse "$CI_COMMIT_TAG^{commit}")
          RUN_ID=$(bash scripts/watch-github-run.sh find --sha "$SHA" --event push ${SINCE:+--since "$SINCE"} || true)
          if [ -z "$RUN_ID" ]; then
            echo "No GitHub run found for tag $CI_COMMIT_TAG" >&2
            exit 1
          fi
          bash scripts/watch-github-run.sh "$RUN_ID"
        fi
      else
        SHA=$(git rev-parse HEAD)
        # A push that transfers nothing triggers no new run; only gate on
        # the trigger time when the ref actually moved.
        REMOTE_MAIN=$(git ls-remote github refs/heads/main | awk '{print $1}')
        SINCE=""
        if [ "$REMOTE_MAIN" != "$SHA" ]; then
          SINCE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
        fi
        git push github HEAD:main
        # Watch the GitHub build for the pushed commit so a failed job on
        # GitHub also fails this pipeline.
        RUN_ID=$(bash scripts/watch-github-run.sh find --sha "$SHA" --event push --branch main ${SINCE:+--since "$SINCE"} || true)
        if [ -z "$RUN_ID" ]; then
          echo "No GitHub run found for pushed commit $SHA" >&2
          exit 1
        fi
        bash scripts/watch-github-run.sh "$RUN_ID"
      fi

# Manual "run the GitHub build" entry point (Run pipeline in the UI).
github-dispatch:
  stage: sync
  <<: *github-common
  timeout: 3h
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
  script:
    - bash scripts/trigger-github-build.sh main true false

github-mr-build:
  stage: sync
  <<: *github-common
  timeout: 3h
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    - bash scripts/trigger-github-build.sh "$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME" true false "$CI_COMMIT_SHA"

# On each push to main: cog bump --auto decides if commits warrant a
# release, writes CHANGELOG.md + version commit + tag. The bump commit is
# pushed with ci.skip; the tag push starts the tag pipeline.
auto-release:
  stage: release
  tags: [linux-truenas]
  image: alpine:3.19
  resource_group: auto-release
  timeout: 30m
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  needs: [github-sync]
  variables:
    COCOGITTO_VERSION: "7.0.0"
  before_script:
    - apk add --no-cache bash curl git
    - curl -fsSL --retry 3 -o /tmp/cog.tar.gz "https://github.com/cocogitto/cocogitto/releases/download/${COCOGITTO_VERSION}/cocogitto-${COCOGITTO_VERSION}-x86_64-unknown-linux-musl.tar.gz"
    - mkdir -p /tmp/cog && tar -xzf /tmp/cog.tar.gz -C /tmp/cog
    - install -m 755 /tmp/cog/x86_64-unknown-linux-musl/cog /usr/local/bin/cog
    - git config user.name "GitLab CI"
    - git config user.email "ci@gitlab.com"
    - git remote set-url origin "https://oauth2:${GITLAB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
  script:
    - bash scripts/auto-release.sh

# Fired by GitHub Actions after a release is built (pipeline trigger
# token). Downloads the GitHub release assets, makes SHA256SUMS, retags
# to the release commit via the deploy key, and recreates the GitLab
# release with --use-package-registry so binaries never expire.
github-release-sync:
  stage: release
  tags: [linux-truenas]
  image: alpine:3.19
  resource_group: release-sync
  rules:
    - if: $CI_PIPELINE_SOURCE == "trigger"
    - if: $CI_PIPELINE_SOURCE == "api"
  before_script:
    - apk add --no-cache bash curl jq git github-cli openssh-client
    - bash scripts/install-glab.sh
    - sh scripts/setup-ssh-key.sh GITLAB_RELEASE_SSH_KEY gitlab.com
  script:
    - bash scripts/sync-from-github.sh

# Publishes the web landing page from the synced release. The web build
# is a marketing page, not the app itself.
pages:
  stage: deploy
  tags: [linux-truenas]
  image: alpine:3.19
  rules:
    - if: $CI_PIPELINE_SOURCE == "trigger" || $CI_PIPELINE_SOURCE == "api"
  needs: [github-release-sync]
  before_script:
    - apk add --no-cache curl tar
  script:
    - |
      PKG_URL="$CI_SERVER_URL/api/v4/projects/$CI_PROJECT_ID/packages/generic/release-assets/$RELEASE_TAG/vsp-web.tar.gz"
      mkdir -p public
      curl -fsSL -H "JOB-TOKEN: $CI_JOB_TOKEN" "$PKG_URL" -o /tmp/web.tar.gz \
        || curl -fsSL -H "PRIVATE-TOKEN: $GITLAB_TOKEN" "$PKG_URL" -o /tmp/web.tar.gz
      tar -xzf /tmp/web.tar.gz -C public
      # AltStore source rides along in Pages too.
      mkdir -p public/altstore
      cp altstore/apps.json public/altstore/apps.json 2>/dev/null || true
  artifacts:
    paths:
      - public
    expire_in: never
